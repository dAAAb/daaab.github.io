name: Refresh SNS-3DQR demo

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/refresh-sns-3dqr.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current demo zip and publish
        run: |
          set -euo pipefail
          EXPECT=9095701341e696ee072a9e3e246a3bc635f17e25b0091afa37733ea80d67ab36
          ok=0
          try_url() {
            local url="$1"
            echo "GET $url"
            if curl -fsSL --retry 3 --retry-delay 2 -A "github-actions" -o /tmp/sns.zip "$url"; then
              if echo "$EXPECT  /tmp/sns.zip" | sha256sum -c; then
                ok=1
                return 0
              fi
            fi
            return 1
          }
          try_url "https://tmpfiles.org/dl/1788093262.0ba62a1b1f7b892a/wmw2Bopxkbnw/sns-3dqr-refresh.zip" || true
          if [[ "$ok" -eq 0 ]]; then
            page=$(curl -fsSL -A "Mozilla/5.0" "https://tmpfiles.org/wmw2Bopxkbnw/sns-3dqr-refresh.zip" || true)
            dl=$(printf '%s' "$page" | sed -n 's/.*href="\(https:\/\/tmpfiles.org\/dl\/[^\"]*\)".*/\1/p' | head -n1)
            if [[ -n "$dl" ]]; then
              try_url "$dl" || true
            fi
          fi
          if [[ "$ok" -eq 0 ]]; then
            echo "Could not download demo zip" >&2
            exit 1
          fi
          mkdir -p SNS-3DQR
          unzip -o /tmp/sns.zip -d SNS-3DQR
          test -f SNS-3DQR/index.html
          test -f SNS-3DQR/assets/index-CZ8fLCou.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SNS-3DQR/index.html \
            SNS-3DQR/assets/index-CZ8fLCou.js SNS-3DQR/assets/index-B-_XZTrM.css
          git rm -f --ignore-unmatch SNS-3DQR/assets/index-P5-nN9Cs.js SNS-3DQR/assets/index-BWusTz9U.js || true
          if git diff --cached --quiet; then
            echo "already current"
            exit 0
          fi
          git commit -m "Refresh SNS-3DQR demo"
          git push
