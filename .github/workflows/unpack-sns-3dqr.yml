name: unpack-sns-3dqr

on:
  push:
    paths:
      - 'SNS-3DQR/_payload/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-sns-3dqr
  cancel-in-progress: true

jobs:
  unpack:
    if: hashFiles('SNS-3DQR/_payload/SHA256SUMS') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack payload into SNS-3DQR
        run: |
          set -euo pipefail
          cd SNS-3DQR/_payload
          sha256sum -c SHA256SUMS
          cat demo.tar.gz.part* > demo.tar.gz
          sha256sum -c <<EOF
          $(grep ' demo.tar.gz$' SHA256SUMS || true)
          EOF
          mkdir -p /tmp/sns-dist
          tar -xzf demo.tar.gz -C /tmp/sns-dist
          cd ../..
          find SNS-3DQR -mindepth 1 -maxdepth 1 ! -name '_payload' -exec rm -rf {} +
          if [ -d /tmp/sns-dist/dist ]; then
            cp -a /tmp/sns-dist/dist/. SNS-3DQR/
          else
            cp -a /tmp/sns-dist/. SNS-3DQR/
          fi
          touch SNS-3DQR/.nojekyll
          rm -rf SNS-3DQR/_payload
      - name: Commit published site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A SNS-3DQR
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Publish SNS-3DQR demo"
          git push
