name: publish-sns-3dqr

on:
  push:
    paths:
      - .github/workflows/publish-sns-3dqr.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack demo into SNS-3DQR/
        env:
          TARBALL_URL: https://litter.catbox.moe/dy5v6c.tar
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/dist.tar "$TARBALL_URL"
          ls -lh /tmp/dist.tar
          rm -rf SNS-3DQR
          mkdir -p SNS-3DQR
          tar -xf /tmp/dist.tar -C SNS-3DQR
          touch SNS-3DQR/.nojekyll
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git rm -f .github/workflows/publish-sns-3dqr.yml
          git add SNS-3DQR
          git commit -m "Publish SNS-3DQR demo"
          git push
